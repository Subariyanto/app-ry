<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2a5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kwitansi">
<title>EduSmart Digital — Aplikasi Kwitansi Modern</title>
<style>
  :root{
    --navy:#0b2a5b;
    --navy2:#123a7a;
    --green:#18a558;
    --green2:#0f8a48;
    --gold:#d4a017;
    --ink:#1a2233;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg:#f4f6fa;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',-apple-system,system-ui,Roboto,'Helvetica Neue',sans-serif;
    background:linear-gradient(135deg,#eef2f9 0%,#e3e9f5 100%);
    color:var(--ink);min-height:100vh;
  }
  /* ===== APP LAYOUT ===== */
  .app{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media(max-width:860px){.app{grid-template-columns:1fr}}

  /* ===== SIDEBAR ===== */
  .sidebar{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
  .brand-card{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    border-radius:18px;padding:20px;color:#fff;box-shadow:0 10px 30px rgba(11,42,91,.25);
  }
  .brand-card img.brand-img{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:14px;background:#fff}
  .brand-card h1{font-size:19px;font-weight:700;letter-spacing:.3px}
  .brand-card p{font-size:12.5px;opacity:.8;margin-top:4px;line-height:1.5}
  .brand-tag{font-size:11px;opacity:.65;margin-top:8px;font-style:italic}

  .panel{background:var(--paper);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(20,40,80,.06);border:1px solid var(--line)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;transition:.15s;
  }
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green2);transform:translateY(-1px);box-shadow:0 6px 16px rgba(24,165,88,.3)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-navy:hover{background:var(--navy2)}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--navy)}
  .btn-sm{padding:7px 11px;font-size:12px;border-radius:8px}
  .btn-danger{background:#fdecec;color:#c0392b}
  .btn-danger:hover{background:#f9d7d7}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .btn-block{width:100%}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.2px}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;
    font-family:inherit;color:var(--ink);background:#fbfcfe;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(24,165,88,.12)}

  .num-list{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .num-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;
    border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:.12s;font-size:13px;
  }
  .num-item:hover{background:#f3f6fb}
  .num-item.active{background:linear-gradient(90deg,rgba(24,165,88,.1),rgba(24,165,88,.04));border-color:var(--green)}
  .num-item .no{font-weight:700;color:var(--navy);font-size:12px}
  .num-item .meta{font-size:11px;color:var(--muted)}
  .num-item .amt{font-weight:700;color:var(--green2);font-size:12.5px}

  /* ===== MAIN / PREVIEW ===== */
  .main{display:flex;flex-direction:column;gap:16px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .topbar .title{font-size:18px;font-weight:700;color:var(--navy)}
  .seg{display:flex;background:#e8edf6;border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:7px 14px;font-size:12.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.08)}

  /* ===== FORM MODE ===== */
  .form-card{background:var(--paper);border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(20,40,80,.06);border:1px solid var(--line)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr}}
  .form-grid .full{grid-column:1/-1}
  .form-card h3{font-size:15px;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:8px}

  /* ===== KWITANSI PREVIEW ===== */
  .preview-wrap{background:var(--paper);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(20,40,80,.1);border:1px solid var(--line)}
  .kwitansi{
    background:#fff;border:2px solid var(--navy);border-radius:12px;overflow:hidden;
    max-width:720px;margin:0 auto;
  }
  .kw-header {
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;border-bottom:2px solid var(--navy);background:linear-gradient(180deg,#fbfcff,#f4f7fd)
  }
  .kw-header img.kop{width:58%;max-width:360px;display:block;height:auto}
  .kw-header .kw-num{position:static;text-align:right;z-index:2;flex-shrink:0}
  .kw-num .kw-title{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:2px}
  .kw-num .kw-sub{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .kw-num .kw-no{font-size:13px;font-weight:700;color:var(--green2);margin-top:8px}

  .kw-body{padding:20px 24px}
  .kw-row{display:flex;padding:9px 0;border-bottom:1px dashed #dfe4ee;gap:12px}
  .kw-row .lbl{width:150px;flex-shrink:0;font-size:12.5px;color:var(--muted);font-weight:600}
  .kw-row .val{flex:1;font-size:13.5px;color:var(--ink);font-weight:600;text-align:left}
  .kw-row .val.amount{font-size:17px;color:var(--green2);font-weight:800}
  .kw-row .val.terbilang{font-style:italic;font-weight:600;color:var(--navy)}
  .kw-row .val .status-pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;
  }
  .pill-lunas{background:#e2f7ec;color:#0f8a48}
  .pill-belum{background:#fdeeee;color:#c0392b}

  .kw-footer{display:flex;align-items:flex-end;justify-content:flex-end;padding:18px 34px 22px;position:relative}
  .kw-sign{text-align:center;flex-shrink:0;min-width:220px;position:relative;padding-top:46px}
  .kw-sign .lok{font-size:12px;color:var(--muted);margin-bottom:2px}
  .kw-sign .firm{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .kw-sign img.sig{height:80px;max-width:200px;object-fit:contain;margin-bottom:2px;display:block;margin-left:auto;margin-right:auto}
  .kw-sign .name{font-size:14px;font-weight:800;color:var(--navy);text-decoration:underline;margin-top:6px}
  .kw-stamp{position:absolute;left:50%;top:56px;transform:translateX(-110%);z-index:3;pointer-events:none}
  .kw-stamp img.stamp{width:128px;height:128px;object-fit:contain;mix-blend-mode:multiply;opacity:.9}

  .kw-baseline{background:var(--navy);color:#fff;text-align:center;padding:9px;font-size:10.5px;letter-spacing:.4px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:center}

  .hidden{display:none!important}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}

  @media print{
    body{background:#fff}
    .app{display:block;padding:0;max-width:none}
    .sidebar,.topbar,.form-card,.actions{display:none!important}
    .preview-wrap{padding:0;box-shadow:none;border:none;border-radius:0}
    .kwitansi{border:none;border-radius:0;max-width:none;box-shadow:none}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand-card">
      <img class="brand-img" id="brandImg" alt="EduSmart Digital">
      <h1>EduSmart Digital</h1>
      <p>Aplikasi Kwitansi Modern &mdash; Digital Application &amp; Education Solutions</p>
      <div class="brand-tag">Kabupaten Jember, Jawa Timur</div>
    </div>

    <div class="panel">
      <h2><span class="dot"></span> Daftar Transaksi</h2>
      <div class="num-list" id="txList"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-primary btn-block" onclick="showForm()">+ Buat Transaksi Baru</button>
      </div>
    </div>

    <div class="panel">
      <h2><span class="dot"></span> Tanda Tangan</h2>
      <div id="sigPreviewBox" style="text-align:center;margin-bottom:10px">
        <img id="sigPreview" style="max-height:64px" alt="">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="uploadSig()">✍️ Upload Tanda Tangan</button>
        <button class="btn btn-ghost btn-sm" onclick="resetSig()">Reset</button>
      </div>
      <div class="hint">PNG/JPG. Tersimpan otomatis di perangkat.</div>
      <input type="file" id="sigFile" accept="image/*" class="hidden" onchange="handleSig(event)">
    </div>

    <div class="panel">
      <h2><span class="dot"></span> Data &amp; Penyimpanan</h2>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="exportData()">💾 Export</button>
        <button class="btn btn-ghost btn-sm" onclick="importDataClick()">📥 Import</button>
        <button class="btn btn-danger btn-sm" onclick="clearData()">🗑 Reset</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="title">🖨️ Kwitansi Pembayaran</div>
      <div class="seg">
        <button id="segPreview" class="active" onclick="setMode('preview')">Pratinjau</button>
        <button id="segForm" onclick="setMode('form')">Entri Data</button>
      </div>
    </div>

    <!-- FORM -->
    <div class="form-card hidden" id="formCard">
      <h3>✏️ <span id="formTitle">Buat Transaksi Baru</span></h3>
      <div class="form-grid">
        <div class="field">
          <label>Tanggal</label>
          <input type="date" id="fTanggal">
        </div>
        <div class="field">
          <label>Nomor Kwitansi</label>
          <input type="text" id="fNomor" placeholder="otomatis...">
        </div>
        <div class="field full">
          <label>Sudah diterima dari</label>
          <input type="text" id="fDari" placeholder="Nama lembaga / perorangan">
        </div>
        <div class="field full">
          <label>Untuk pembayaran</label>
          <input type="text" id="fUntuk" placeholder="Keterangan pembayaran">
        </div>
        <div class="field">
          <label>Nominal (Rp)</label>
          <input type="number" id="fNominal" min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label>Metode Pembayaran</label>
          <select id="fMetode">
            <option>Transfer</option>
            <option>Tunai</option>
            <option>QRIS</option>
            <option>Debit/Kredit</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="fStatus">
            <option>LUNAS</option>
            <option>BELUM LUNAS</option>
          </select>
        </div>
        <div class="field">
          <label>Catatan (opsional)</label>
          <input type="text" id="fCatatan" placeholder="Catatan tambahan">
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-primary" onclick="saveTx()">💾 Simpan</button>
        <button class="btn btn-ghost" onclick="cancelForm()">Batal</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-wrap" id="previewWrap">
      <div class="kwitansi" id="kwitansi">
        <!-- diisi JS -->
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="printKwitansi()">🖨️ Cetak / PDF</button>
        <button class="btn btn-navy" onclick="editCurrent()">✏️ Edit</button>
        <button class="btn btn-ghost" onclick="duplicateCurrent()">⧉ Duplikat</button>
        <button class="btn btn-danger" onclick="deleteCurrent()">🗑 Hapus</button>
      </div>
    </div>
  </main>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>

function load(){
  try{
    const s = localStorage.getItem(STORE_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return seed();
}
function loadSig(){
  try{ return localStorage.getItem(SIG_KEY) || null; }catch(e){ return null; }
}
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(rows)); }

function seed(){
  const t = new Date();
  const y = t.getFullYear();
  const d = isoDate(t);
  return [
    {id:uid(), tanggal:d, nomor:`ESD/KWT/0001/${y}`, dari:"MTsN 01 BU", untuk:"Pembelian Aplikasi Digital", nominal:300000, metode:"Transfer", status:"LUNAS", catatan:""},

  ];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ==================== HELPERS ==================== */
function terbilang(n){
  n = Math.floor(Number(n)||0);
  if(n===0) return "Nol rupiah";
  const satuan = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  function ratus(x){
    let s="";
    const r = Math.floor(x/100), sisa = x%100;
    if(r>0){ s += (r===1?"seratus":satuan[r]+" ratus") + (sisa>0?" ":" "); }
    if(sisa>0){
      if(sisa<12) s += satuan[sisa];
      else if(sisa<20) s += satuan[sisa-10]+" belas";
      else { const p=Math.floor(sisa/10), u=sisa%10; s += satuan[p]+" puluh"+(u? " "+satuan[u]:""); }
    }
    return s.trim();
  }
  const t = Math.floor(n/1e12), m = Math.floor((n%1e12)/1e9), jt = Math.floor((n%1e9)/1e6), rb = Math.floor((n%1e6)/1e3), s = n%1e3;
  let hasil = "";
  if(t) hasil += ratus(t)+" triliun ";
  if(m) hasil += ratus(m)+" miliar ";
  if(jt) hasil += ratus(jt)+" juta ";
  if(rb) hasil += ratus(rb)+" ribu ";
  if(s) hasil += ratus(s)+" ";
  return hasil.trim().replace(/\s+/g," ") + " rupiah";
}
function fmtRp(n){
  n = Number(n)||0;
  return "Rp " + n.toLocaleString("id-ID");
}
function fmtTanggal(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return d.getDate()+" "+bulan[d.getMonth()]+" "+d.getFullYear();
}
function nextNomor(){
  const y = new Date().getFullYear();
  const nums = rows.map(r=>{
    const m = (r.nomor||"").match(/(\d{4})/);
    return m? parseInt(m[1]):0;
  }).filter(x=>x>0);
  const next = nums.length? Math.max(...nums)+1 : 1;
  return `ESD/KWT/${String(next).padStart(4,"0")}/${y}`;
}

function renderList(){
  const el = document.getElementById("txList");
  if(!rows.length){
    el.innerHTML = '<div class="empty">Belum ada transaksi.<br>Klik "Buat Transaksi Baru".</div>';
    return;
  }
  el.innerHTML = rows.map(r=>{
    const active = r.id===selectedId ? "active":"";
    return `<div class="num-item ${active}" onclick="selectTx('${r.id}')">
      <div><div class="no">${esc(r.nomor)}</div><div class="meta">${esc(r.dari)}</div></div>
      <div class="amt">${fmtRp(r.nominal)}</div>
    </div>`;
  }).join("");
}
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

    <div class="kw-body">
      <div class="kw-row"><div class="lbl">Sudah diterima dari</div><div class="val">${esc(r.dari)}</div></div>
      <div class="kw-row"><div class="lbl">Uang sejumlah</div><div class="val amount">${fmtRp(r.nominal)}</div></div>
      <div class="kw-row"><div class="lbl">Terbilang</div><div class="val terbilang">${esc(terbilang(r.nominal))}</div></div>
      <div class="kw-row"><div class="lbl">Untuk pembayaran</div><div class="val">${esc(r.untuk)}</div></div>
      <div class="kw-row"><div class="lbl">Metode pembayaran</div><div class="val">${esc(r.metode)}</div></div>
      <div class="kw-row"><div class="lbl">Status</div><div class="val">${st}</div></div>
      ${r.catatan?`<div class="kw-row"><div class="lbl">Catatan</div><div class="val">${esc(r.catatan)}</div></div>`:""}
    </div>
    <div class="kw-footer">
      <div class="kw-sign">
        <div class="lok">Jember, ${esc(fmtTanggal(r.tanggal))}</div>
        <div class="firm">${esc(SETTINGS.usaha)}</div>
        <img class="sig" src="${sigSrc()}">
        <div class="name">${esc(SETTINGS.penerima)}</div>
        <div class="kw-stamp">
          <img class="stamp" src="${ASSETS.STAMP}" alt="stempel">
        </div>
      </div>
    </div>
    <div class="kw-baseline">${esc(SETTINGS.usaha)} &nbsp;|&nbsp; ${esc(SETTINGS.tagline)} &nbsp;|&nbsp; ${esc(SETTINGS.hp)} &nbsp;|&nbsp; ${esc(SETTINGS.email)}</div>
  `;
}

function renderAll(){
  renderList();
  renderKwitansi();
  const segPreview = document.getElementById("segPreview");
  const segForm = document.getElementById("segForm");
  const formCard = document.getElementById("formCard");
  if(segPreview.classList.contains("active")){
    formCard.classList.add("hidden");
  } else {
    formCard.classList.remove("hidden");
  }
}

/* ==================== ACTIONS ==================== */
function selectTx(id){ selectedId = id; renderAll(); }
function setMode(m){
  document.getElementById("segPreview").classList.toggle("active", m==="preview");
  document.getElementById("segForm").classList.toggle("active", m==="form");
  renderKwitansi();
  const fc = document.getElementById("formCard");
  if(m==="form" && !editingId){ showForm(); }
  else if(m==="preview"){ fc.classList.add("hidden"); }
}

let editingId = null;
function showForm(){
  editingId = null;
  document.getElementById("formTitle").textContent = "Buat Transaksi Baru";
  document.getElementById("fTanggal").value = isoDate(new Date());
  document.getElementById("fNomor").value = nextNomor();
  document.getElementById("fDari").value = "";
  document.getElementById("fUntuk").value = "Pembelian Aplikasi Digital";
  document.getElementById("fNominal").value = "";
  document.getElementById("fMetode").value = "Transfer";
  document.getElementById("fStatus").value = "LUNAS";
  document.getElementById("fCatatan").value = "";
  setMode("form");
}
function cancelForm(){ setMode("preview"); }
function editCurrent(){
  const r = rows.find(x=>x.id===selectedId);
  if(!r){ alert("Pilih transaksi dulu."); return; }
  editingId = r.id;
  document.getElementById("formTitle").textContent = "Edit Transaksi";
  document.getElementById("fTanggal").value = r.tanggal;
  document.getElementById("fNomor").value = r.nomor;
  document.getElementById("fDari").value = r.dari;
  document.getElementById("fUntuk").value = r.untuk;
  document.getElementById("fNominal").value = r.nominal;
  document.getElementById("fMetode").value = r.metode;
  document.getElementById("fStatus").value = r.status;
  document.getElementById("fCatatan").value = r.catatan||"";
  setMode("form");
}
function saveTx(){
  const tgl = document.getElementById("fTanggal").value;
  const nomor = document.getElementById("fNomor").value.trim() || nextNomor();
  const dari = document.getElementById("fDari").value.trim();
  const untuk = document.getElementById("fUntuk").value.trim();
  const nominal = Number(document.getElementById("fNominal").value)||0;
  const metode = document.getElementById("fMetode").value;
  const status = document.getElementById("fStatus").value;
  const catatan = document.getElementById("fCatatan").value.trim();
  if(!tgl){ alert("Tanggal wajib diisi."); return; }
  if(!dari){ alert("Kolom 'Sudah diterima dari' wajib diisi."); return; }
  if(nominal<=0){ alert("Nominal harus lebih dari 0."); return; }

  if(editingId){
    const r = rows.find(x=>x.id===editingId);
    if(r){ Object.assign(r,{tanggal:tgl,nomor,dari,untuk,nominal,metode,status,catatan}); }
  } else {
    const r = {id:uid(), tanggal:tgl, nomor, dari, untuk, nominal, metode, status, catatan};
    rows.push(r);
    selectedId = r.id;
  }
  persist();
  editingId = null;
  setMode("preview");
  renderAll();
}
function deleteCurrent(){
  const r = rows.find(x=>x.id===selectedId);
  if(!r){ alert("Pilih transaksi dulu."); return; }
  if(!confirm(`Hapus transaksi ${r.nomor}?`)) return;
  rows = rows.filter(x=>x.id!==selectedId);
  selectedId = rows.length? rows[rows.length-1].id : null;
  persist();
  renderAll();
}
function duplicateCurrent(){
  const r = rows.find(x=>x.id===selectedId);
  if(!r){ alert("Pilih transaksi dulu."); return; }
  const c = {
    id:uid(), tanggal:r.tanggal, nomor:nextNomor(), dari:r.dari, untuk:r.untuk,
    nominal:r.nominal, metode:r.metode, status:r.status, catatan:r.catatan
  };
  rows.push(c);
  selectedId = c.id;
  persist();
  renderAll();
}
function printKwitansi(){ window.print(); }

/* ==================== TANDA TANGAN ==================== */
function sigSrc(){ return customSignature || ASSETS.TTD; }
function updateSigPreview(){
  const img = document.getElementById("sigPreview");
  const box = document.getElementById("sigPreviewBox");
  if(customSignature){ img.src = customSignature; box.style.display = "block"; }
  else { box.style.display = "none"; }
}
function uploadSig(){ document.getElementById("sigFile").click(); }
function handleSig(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = c.toDataURL("image/png");
      customSignature = dataUrl;
      try{ localStorage.setItem(SIG_KEY, dataUrl); }catch(err){ alert("Gambar terlalu besar, coba gambar lebih kecil."); }
      updateSigPreview();
      renderKwitansi();
      alert("Tanda tangan tersimpan.");
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
  e.target.value = "";
}
function resetSig(){
  customSignature = null;
  localStorage.removeItem(SIG_KEY);
  updateSigPreview();
  renderKwitansi();
}

/* ==================== PERSIST EX/IMPORT ==================== */
function exportData(){
  const blob = new Blob([JSON.stringify(rows,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kwitansi-edusmart-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importDataClick(){ document.getElementById("importFile").click(); }
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const data = JSON.parse(rd.result);
      if(!Array.isArray(data)) throw new Error("format");
      rows = data;
      selectedId = rows.length? rows[0].id:null;
      persist();
      renderAll();
      alert("Data berhasil diimpor ("+rows.length+" transaksi).");
    }catch(err){ alert("File tidak valid."); }
  };
  rd.readAsText(f);
  e.target.value="";
}
function clearData(){
  if(!confirm("Reset semua data ke contoh awal? Data yang ada akan hilang.")) return;
  localStorage.removeItem(STORE_KEY);
  rows = seed();
  selectedId = rows.length? rows[0].id:null;
  persist();
  renderAll();
}

/* ==================== INIT ==================== */
function init(){
  document.getElementById("brandImg").src = ASSETS.BANNER;
  updateSigPreview();
  if(!selectedId && rows.length) selectedId = rows[0].id;
  renderAll();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
